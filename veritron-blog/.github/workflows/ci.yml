name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Secret scan
        run: npm run secrets
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Quality gate (CSP, links, a11y basics, feeds)
        run: npm run check
      - name: Dependency audit
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts && npm run build
      # Needs a repository secret FIREBASE_SERVICE_ACCOUNT (JSON of a deploy-only service account).
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: biggandaily
